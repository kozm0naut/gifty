# T026 — 002 SC-004 / US3-AC1 (quickstart V8): genuine clean-machine evidence.
#
# Proves the "second clean machine / fresh CI environment" leg of 002 SC-004:
# on a clean GitHub runner, following only the documented sequence
# (docs/docker.md + contracts/deployment.md §1/§4), a working app is
# reached at http://localhost:8080, and the full Playwright e2e suite
# (8 tests) passes against the containerized single-origin app.
name: Docker deployment (002 SC-004)

on:
  push:
    branches: [main, master, 'docker-container']
  pull_request:
    branches: [main, master, 'docker-container']
  workflow_dispatch:

jobs:
  containerized-e2e:
    name: "Clean runner: build, start, readiness, e2e"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Credentials: JWT_SECRET AND POSTGRES_PASSWORD are required with no
      # default (Constitution §IV / 003 FR-006). A clean runner has no .env, so seed
      # them once via the SAME mechanism local `npm run docker:up` uses
      # (scripts/ensure-env.mjs — absent-only, idempotent, strong random).
      # Without a value, postgres boots with an empty password, fails its
      # pg_isready healthcheck, and `depends_on: service_healthy` blocks the app.
      - name: Seed run-scoped credentials (POSTGRES_PASSWORD + JWT_SECRET)
        run: node scripts/ensure-env.mjs

      - name: Start the full stack (docker compose up --build -d)
        run: |
          set -eu
          docker compose up --build -d

      # Readiness signal (002 FR-013, contracts §4): poll until 200 — 2-minute budget.
      - name: Wait for readiness (GET /healthz -> 200 within 2 minutes)
        run: |
          set -eu
          for i in $(seq 1 120); do
            if curl -fs http://localhost:8080/healthz > /dev/null 2>&1; then
              echo "Gifty is ready at http://localhost:8080"
              curl -fs http://localhost:8080/healthz; echo
              exit 0
            fi
            sleep 1
          done
          echo "::error::Gifty did not report ready within 2 minutes"
          docker compose logs --no-color
          exit 1

      # 002 SC-002 in a clean environment: the existing e2e suite is the acceptance
      # validation (quickstart "Automated validation").
      - name: Run Playwright e2e against http://localhost:8080
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          BASE_URL=http://localhost:8080 npx playwright test
        env:
          CI: true

      - name: Teardown
        if: always()
        run: docker compose down || true

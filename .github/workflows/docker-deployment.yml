# T026 — SC-004 / US3-AC1 (quickstart V8): genuine clean-machine evidence.
#
# Proves the "second clean machine / fresh CI environment" leg of SC-004:
# on a clean GitHub runner, following only the documented sequence
# (docs/docker.md + contracts/deployment.md §1/§4), a working app is
# reached at http://localhost:8080, and the full Playwright e2e suite
# (8 tests) passes against the containerized single-origin app.
name: Docker deployment (SC-004)

on:
  push:
    branches: [main, master, 'docker-container']
  pull_request:
    branches: [main, master, 'docker-container']
  workflow_dispatch:

jobs:
  containerized-e2e:
    name: "Clean runner: build, start, readiness, e2e"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Documented start (contracts/deployment.md §1). JWT_SECRET is required
      # with no default (Constitution §IV) — generate a run-scoped secret the
      # same way docs/docker.md §1 instructs operators to.
      - name: Start the full stack (docker compose up --build -d)
        run: |
          set -eu
          export JWT_SECRET="$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          docker compose up --build -d

      # Readiness signal (FR-013, contracts §4): poll until 200 — 2-minute budget.
      - name: Wait for readiness (GET /healthz -> 200 within 2 minutes)
        run: |
          set -eu
          for i in $(seq 1 120); do
            if curl -fs http://localhost:8080/healthz > /dev/null 2>&1; then
              echo "Gifty is ready at http://localhost:8080"
              curl -fs http://localhost:8080/healthz; echo
              exit 0
            fi
            sleep 1
          done
          echo "::error::Gifty did not report ready within 2 minutes"
          docker compose logs --no-color
          exit 1

      # SC-002 in a clean environment: the existing e2e suite is the acceptance
      # validation (quickstart "Automated validation").
      - name: Run Playwright e2e against http://localhost:8080
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          BASE_URL=http://localhost:8080 npx playwright test
        env:
          CI: true

      - name: Teardown
        if: always()
        run: docker compose down || true

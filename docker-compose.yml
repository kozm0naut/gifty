# Gifty — two-container stack: postgres (internal-only) + app (SPA + API).
# Normative contract: specs/002-docker-deployment/contracts/deployment.md
#   * single URL      : http://localhost:8080  (host ${PORT:-8080} -> container 4000)
#   * readiness       : GET /healthz  (poll until 200 {"status":"ok"})
#   * DB internal-only: NOT published to the host (Constitution §I/§IV)
#   * data volume     : gifty_postgres_data (survives `down`, removed by `down -v`)
#   * JWT_SECRET      : REQUIRED — no default; startup fails fast if unset (§IV)
#   * POSTGRES_PASSWORD : REQUIRED — no default (003 FR-006); a known default is refused

services:
  postgres:
    image: postgres:16.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gifty
      POSTGRES_USER: gifty
      # REQUIRED — no default (003 FR-006): the operator supplies a strong credential
      # via .env / the environment; a known default is refused by the app's boot gate.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - gifty_postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -h postgres: verify the TCP path the app actually uses, not the local
      # unix socket (a socket-only check can pass while inter-container routing
      # — flaky under Docker-in-Docker / Codespaces — is not yet up).
      test: ["CMD-SHELL", "pg_isready -h postgres -U gifty -d gifty"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - gifty_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gifty-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # PORT is fixed to 4000 inside the image (Dockerfile ENV); the host-side
      # ${PORT:-8080} in `ports:` below is the only published mapping.
      # ${POSTGRES_PASSWORD} is REQUIRED (no default; 003 FR-006) from the operator env.
      DATABASE_URL: postgresql://gifty:${POSTGRES_PASSWORD}@postgres:5432/gifty?schema=public
      # Required — injected from .env at `up` time; no default is permitted.
      JWT_SECRET: ${JWT_SECRET}
      # Optional operator settings (003 US2 trust boundary, 003 FR-003/003 FR-004):
      # CORS_ORIGINS — comma-separated allow-list; unset = closed by default.
      # CSP_FONT_ORIGIN — CSP font-src permitted origin(s); default = Google Fonts.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      CSP_FONT_ORIGIN: ${CSP_FONT_ORIGIN:-}
      # Feature 004 (email integration) — boot gate (validateConfig, US5/004 FR-009):
      # in production the app refuses to boot if email is enabled but no live
      # Resend credential is present (it would emit links that can never be
      # delivered). These are operator-supplied, no defaults (mirrors JWT_SECRET):
      #   RESEND_API_KEY  — REQUIRED for live mode; empty = capture/disabled gate.
      #   RESEND_FROM     — REQUIRED for live mode (must be a valid email); blank is
      #                     allowed in capture mode and in disabled mode (EMAIL_ENABLED=false).
      #   EMAIL_ENABLED   — optional override; empty = default true.
      #   EMAIL_TRANSPORT — optional override; 'capture'/'test' = dev/test stub.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-}
    ports:
      - "${PORT:-8080}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # node:alpine has no curl; Node 22's global fetch is used instead.
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - gifty_net

networks:
  gifty_net:
    driver: bridge

volumes:
  gifty_postgres_data:
